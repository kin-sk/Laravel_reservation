server {
    # Cloud Runはデフォルトで8080ポートを使用する
    listen 8080;

    # Laravelの公開ディレクトリ
    root /workspace/src/public;
    
    # index.htmlを削除し、index.phpのみに絞る
    index index.php;

    # 文字コード設定（任意）
    charset utf-8;

    location / {
        # アクセスされたURLがファイルとして存在しなければ、すべてindex.phpに送る（Laravelの基本）
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPMとの連携設定
    location ~ \.php$ {
        fastcgi_pass app:9000;
        # fastcgi_indexを追加
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # セキュリティ対策：PHPのパス情報を正しく処理する
        fastcgi_hide_header X-Powered-By;
    }

    # ログ出力先を標準出力/エラー出力（Cloud Runのログで見れるようになる）
    access_log /dev/stdout;
    error_log /dev/stderr;

    # .htaccessや.gitなど、隠しファイルへのアクセスを禁止
    location ~ /\.(?!well-known).* {
        deny all;
    }

}